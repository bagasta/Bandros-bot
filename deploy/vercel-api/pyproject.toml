[project]
name = "bandros-api"
version = "0.1.0"
description = "Bandros API for Vercel"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.15.1,<3",
  "python-dotenv>=1,<2",
  "pydantic>=2.12,<3",
]

[tool.vercel]
entrypoint = "index:app"
