[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-agent-workspace"
version = "0.1.0"
description = "Local-first persistent AI teammate platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20,<2",
  "dbos>=3.1,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "playwright>=1.50,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "pydantic-ai-slim[openai]>=1,<2",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
