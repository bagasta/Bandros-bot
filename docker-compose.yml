services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_workspace"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/agent-workspace.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
